<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F9FA" />
    <meta name="color-scheme" content="light dark" />
    <title>FitGram — Treina melhor. Evolui sempre.</title>
    <meta
      name="description"
      content="Uma plataforma para criares treinos, acompanhares a nutrição e transformares progresso em resultados."
    />

    <!-- Open Graph / link previews (WhatsApp, Slack, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FitGram — Treina melhor. Evolui sempre." />
    <meta property="og:description" content="Treino, nutrição e evolução ligados numa única plataforma. Candidata-te à beta." />
    <meta property="og:image" content="https://fitgram1.github.io/fitgram-landing-page/og-image.png" />
    <meta property="og:url" content="https://fitgram.app" />
    <meta property="og:site_name" content="FitGram" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="FitGram" />
    <meta name="apple-mobile-web-app-title" content="FitGram" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply theme before paint to avoid a flash of the wrong color scheme.
      (function () {
        try {
          var saved = localStorage.getItem('fitgram.theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0B0C0E' : '#F8F9FA');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
