server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão (o mp4 já está comprimido; foca em texto/JS/CSS/SVG).
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets com hash no nome (Vite) — cache longo e imutável.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O index.html nunca é cacheado (para apanhar novos deploys).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
